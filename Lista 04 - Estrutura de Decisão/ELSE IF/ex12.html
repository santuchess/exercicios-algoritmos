<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Informe um número:
    <input type="text" id="ipt_numero" />
    <button onclick="analisar()">Múltiplo de 5</button>
    <div id="id_exibir"></div>
  </body>
</html>
<script>
  function analisar() {
    let numero = Number(ipt_numero.value);

    if (numero <= 0) {
      alert("Digite um número maior que zero");
    } else {
      let resto = numero % 5;

      if (resto == 0) {
        id_exibir.innerHTML = `Perfeito, esse número é múltiplo de cinco`;
      } else if (resto == 1) {
        id_exibir.innerHTML = `Vich, sobrou um`;
      } else if (resto == 2) {
        id_exibir.innerHTML = `Para esse o resto é dois`;
      } else if (resto == 3) {
        id_exibir.innerHTML = `Com mais dois daria certo`;
      } else if (resto == 4) {
        id_exibir.innerHTML = `Só faltou 1 para ser múltiplo de 5`;
      }
    }
  }
</script>
