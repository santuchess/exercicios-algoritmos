<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Sua nota
    <input type="text" id="id_nota">
    <button onclick="mostrar()">Classificar aluno</button>
    <div id="id_exibir"></div>
</body>
</html>
<script>
    function mostrar() {
        let nota = Number(id_nota.value)

        if(nota < 5) {
            alert(`Aluno precisa de muita ajuda`)
        } else if(nota <= 7) {
            alert(`Aluno na média`)
        } else if(nota < 9.5) {
            alert(`Aluno na acima da média`) 
        } else {
            alert(`Aluno fora da curva`)
        }
    }
</script>
