<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Quantas latinhas de refrigerante toma por dia?</span>
    <input type="text" id="id_refri"><br>
    <button onclick="qtdRefri()">Quantos refris?</button>
    <div id="id_exibir"></div>
</body>
</html>
<script>
    function qtdRefri() {
        let quantidade = Number(id_refri.value)
        let resultado = quantidade * 365

        if (resultado >= 500){
            id_exibir.innerHTML = `Você bebe ${resultado} por ano cuidado com a diabetes!`
        } else {
            id_exibir.innerHTML = `Você bebe ${resultado}, tudo bem pode tomar mais`
        }
    }
</script>
