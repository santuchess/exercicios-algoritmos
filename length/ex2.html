<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Detector de Palavras</H1>
    Informe uma frase:
    <input type="text" id="ipt_frase"><br>
    <button onclick="verificar()">Analisar frase</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function verificar() {
        let frase = ipt_frase.value

        if(frase.includes("teste") || frase.includes("abc") || frase.includes("spam")) {
            div_mensagem.innerHTML = `<span style="color: red">Frase invalida<span>`
        } else {
            div_mensagem.innerHTML = `<span style="color: green">Frase valida!<span>`
        }


    }
</script>
