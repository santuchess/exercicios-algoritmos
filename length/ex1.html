<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Informe uma frase:
    <input  type="text" id="ipt_frase">
    <button onclick="verificar()">Analisar frase</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function verificar() {
        let frase = ipt_frase.value;
        let tamanho = frase.length;

        if (tamanho < 10) {
            div_mensagem.innerHTML = `A frase tem ${tamanho} caracteres.<span style="color: red;">Frase Curta!</span>`;
        } else if (tamanho > 10) {
            div_mensagem.innerHTML = `A frase tem ${tamanho} caracteres.<span style="color: blue;">Frase longa!</span>`;
        }
        
    }
</script>
