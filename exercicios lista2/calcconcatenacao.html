<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>CALCULADORA LEGAL</title>
</head>
<body>
    <input type="text" id="id_numero1">
    <input type="text" id="id_numero2">
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="divisao()">Divisão</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="somar()">Somar</button>
    <div id="id_exibir"></div>
</body>
</html>
<script>
    function multiplicar() {
        id_exibir.innerHTML = 'O resultado da multiplicação é: ' + (Number (id_numero1.value) * Number (id_numero2.value))
    }

    function divisao() {
        id_exibir.innerHTML = 'O resultado da divisão é: ' + (Number (id_numero1.value) / Number (id_numero2.value))
    }

    function subtrair() {
        id_exibir.innerHTML = 'O resultado da subtração é: ' + (Number (id_numero1.value) - Number (id_numero2.value))
    }

    function somar() {
    id_exibir.innerHTML = 'O resultado da soma é: ' + (Number (id_numero1.value) + Number (id_numero2.value))
    }
</script>
