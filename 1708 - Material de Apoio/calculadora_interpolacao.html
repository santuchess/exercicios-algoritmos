<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora legal</title>
  </head>
  <body>
    <input type="text" id="ipt_numero1" />
    <input type="text" id="ipt_numero2" />
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="somar()">Somar</button>
    <div id="div_exibir"></div>
  </body>
</html>
<script>
  function multiplicar() {
    div_exibir.innerHTML = `O resultado da multiplacação é ${Number(ipt_numero1.value) * Number(ipt_numero2.value)}`;
  }

  function dividir() {
    div_exibir.innerHTML = `O resultado da divisão é: " ${Number(ipt_numero1.value) / Number(ipt_numero2.value)} `;
  }

  function subtrair() {
    div_exibir.innerHTML = `O resultado da subtração é: ${Number(ipt_numero1.value) - Number(ipt_numero2.value)}`;
  }

  function somar() {
    div_exibir.innerHTML = `O resultado da soma é: ${Number(ipt_numero1.value) + Number(ipt_numero2.value)} `;
  }
</script>
