<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Matricula em Curso Avançado</h1>
    Aluno concluiu o curso basico?:
    <select id="select_curso">
        <option disabled selected>Selecione uma opção</option>
        <option>Sim</option>
        <option>Não</option>
    </select><br>
    Qual é a media do aluno?:
    <input type="text" id="ipt_media"><br>
    Qual é a nota do aluno na prova de nivelamento?:
    <input type="text" id="ipt_nivelamento"><br>
    A documentação do aluno está completa?:
    <select id="select_documentacao">
        <option disabled selected>Selecione uma opção</option>
        <option>Sim</option>
        <option>Não</option>
    </select><br>
    <button onclick="verificar()">Verificar Matrícula</button>
</body>
</html>
<script>
    function verificar() {
        let curso = select_curso.value;
        let media = Number(ipt_media.value);
        let nivelamento = Number(ipt_nivelamento.value);
        let documentacao = select_documentacao.value;

        if (curso == 'Sim' && (media >= 7 || nivelamento >= 8) && documentacao == 'Sim') {
            alert('Matrícula liberada para o curso avançado!');
        } else {
            alert('Matrícula não foi aprovada.');
        }
    }
</script>
