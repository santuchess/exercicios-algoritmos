<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Qual metodo de pagamento deseja?
    <select id="select_pagamento">
      <option>Dinheiro</option>
      <option>Cartão de débito</option>
      <option>Cartão de crédito</option>
      <option>Boleto</option>
    </select>
    <button onclick="verificar()">Analisar compra</button>
    <div id="div_mensagem"></div>
  </body>
</html>
<script>
  function verificar() {
    let modoPagamento = select_pagamento.value;

    if (modoPagamento == "Dinheiro" || modoPagamento == "Cartão de débito") {
      div_mensagem.innerHTML = `Você terá que pagar a vista`;
    } else {
      div_mensagem.innerHTML = `Pagamento poderá ser parcelado`;
    }
  }
</script>
