<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Qual é a temperatura atual?:
    <input type="text" id="ipt_temperatura" />
    <button onclick="verificar()">Verificar</button>
    <div id="div_mensagem"></div>
  </body>
</html>
<script>
  function verificar() {
    let temperatura = Number(ipt_temperatura.value);

    if (temperatura >= 21 && temperatura <= 24) {
      alert("Temperatura confortável :D");
    } else {
      alert("Temperatura DESCONFORTÁVEL :C");
    }
  }
</script>
