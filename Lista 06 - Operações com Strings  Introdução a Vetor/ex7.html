<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Senha Forte ou Fraca</h1>

    Informe sua senha:
    <input type="text" id="ipt_senha" oninput="verificar()" />
    <div id="div_mensagem"></div>
  </body>
</html>
<script>
  function verificar() {
    let senha = ipt_senha.value;
    let criterios = 0;

    if (senha.length >= 8) criterios++;
    if (senha.toLowerCase() != senha) criterios++;
    if (senha.toUpperCase() != senha) criterios++;

    if (criterios == 3) {
      div_mensagem.innerHTML = `Senha Forte ${criterios}`;
    } else if (criterios == 2) {
      div_mensagem.innerHTML = `Senha Média ${criterios}`;
    } else if (criterios == 1) {
      div_mensagem.innerHTML = `Senha Fraca ${criterios}`;
    } else {
      div_mensagem.innerHTML = `Senha Insegura ${criterios}`;
    }
  }
</script>
