<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Comparador de Palavras</H1>
    Informe uma palavra:
    <input type="text" id="ipt_palavra1"><br>
    Informe uma palavra
    <input type="text" id="ipt_palavra2"><br>
    <button onclick="verificar()"">Analisar Palavras</button>
    <div id="div_mensagem""></div>
</body>
</html>
<script>
    function verificar() {
        let palavra1 = ipt_palavra1.value
        let palavra2 = ipt_palavra2.value
 

        if (palavra1 == palavra2) {
            div_mensagem.innerHTML = `As palavras ${palavra1} e ${palavra2} são exatamente iguais!`
        } else if (palavra1.toLowerCase() == palavra2.toLowerCase()) {
            div_mensagem.innerHTML = `As palavras ${palavra1} e ${palavra2} possuem o mesmo conteúdo, mas a digitação é diferente`
        } else {
            div_mensagem.innerHTML = `As palavras ${palavra1} e ${palavra2} são completamente diferentes!`
        }
        
    }
</script>
