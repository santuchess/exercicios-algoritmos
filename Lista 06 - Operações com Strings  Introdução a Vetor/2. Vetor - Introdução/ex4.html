<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Top Filmes Favoritos: Do Mais Amado ao Menos</h1>
    informa os nomes dos filmes que mais gosta:
    <input type="text" id="ipt_filme">
    <button onclick="cadastrar()">Cadastrar filme</button>
    <button onclick="favoritos()">Ver favoritos</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
  let lista = [];
  function cadastrar() {
    let filme = ipt_filme.value;
    lista.push(filme);
    console.log(lista);
  }
  function favoritos() {
    div_mensagem.innerHTML = `
    Total ${lista} <br>
    Favorito ${lista[0]} <br>
    O que filme que mais gosta é ${lista[0]} <br> 
    E desses, o que menos gosta é ${lista[lista.length - 1]}`
  } 
</script>
