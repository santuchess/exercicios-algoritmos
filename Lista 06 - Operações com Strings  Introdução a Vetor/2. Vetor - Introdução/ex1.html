<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Caça às Frutas: Descubra se está na Lista</h1>
    Informe o nome de uma fruta:
    <input type="text" id="ipt_fruta">
    <button onclick="pesquisar()">Pesquisar</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    let lista = ['abacate', 'banana', 'caju', 'damasco'];
    function pesquisar() {
        
        let fruta = ipt_fruta.value

        if (lista.includes(fruta)) {
            div_mensagem.innerHTML = `A fruta ${fruta} existe na lista.`
        } else {
            div_mensagem.innerHTML = `Não existe a fruta ${fruta} na lista.`
        }

    }
</script>
