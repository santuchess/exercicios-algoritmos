<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Avaliação do Clima: Está Agradável ou Desconfortável?</h1>
    Informa a temperatura:
    <input type="text" id="ipt_temperatura"><br>
    Informe a umidade do ar:
    <input type="text" id="ipt_umidade"><br>
    <button onclick="avaliar()">Avaliar Clima</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function avaliar() {
        let temperatura = Number(ipt_temperatura.value)
        let umidade = Number(ipt_umidade.value)

        if (umidade < 0 || umidade > 100 || temperatura < 0 || temperatura > 40) {
            alert (`valor de umidade invalido`)
        } else if ((temperatura >= 22 || temperatura <= 23) && umidade < 60) {
            div_mensagem.innerHTML = `Clima Agradavel!`
        } else {
            div_mensagem.innerHTML = `Clima desconfortável`
        }
    }
</script>
