<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cansaço SPTech</title>
</head>
<body>
    <h1>Calculadora de cansaço do aluno SPTech</h1>

    Meio de transporte:
    <input type="text" id="ipt_transporte">
    <button onclick="calcular()">Calcular cansaço</button>
</body>
</html>
<script>
    function calcular() {
        let transporte = ipt_transporte.value

        if (transporte == "Carro" || transporte == "Uber") {
            alert("Tá tranquilo...")

        } else if (transporte == "Metrô" || transporte == "Ônibus") {
            alert("Um pouco cansado")

        } else if (transporte == "Bicicleta") {
            alert("Vish... vive cansado.")
        }
    }
</script>
