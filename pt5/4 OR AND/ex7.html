<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Financiamento de Veículo</h1>
    Qual é a idade do solicitante?
    <input type="text" id="ipt_idade"><br>
    Tem cnh valida?:
    <select id="select_cnh">
        <option disabled selected>Selecione uma opção</option>
        <option>Sim</option>
        <option>Não</option>
    </select><br>
    Qual é a renda mensal do solicitante?:
    <input type="text" id="ipt_renda"><br>
    Apresentou um fiador?:
    <select id="select_fiador">
        <option disabled selected>Selecione uma opção</option>
        <option>Sim</option>
        <option>Não</option>
    </select> <br>
    <button onclick="analisar()">Analisar financiamento</button>
</body>
</html>
<script>
    function analisar() {
        let idade = Number(ipt_idade.value);
        let cnh = select_cnh.value;
        let renda = Number(ipt_renda.value);
        let fiador = select_fiador.value;

        if (idade >= 21 && (renda >= 2500 || fiador == 'Sim' || cnh == 'Sim')) {
            alert('Financiamento aprovado');
        } else {
            alert('Financiamento negado');
        }
    }
</script>
