<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>distância que será percorrida, em quilômetros?</span>
    <input type="text" id="ipt_km"><br>
    <span>velocidade média do carro, em quilômetros por hora</span>
    <input type="text" id="ipt_velo"><br>
    <button onclick="mostrar()">Simular</button>
    <div id="id_exibir"></div>
</body>
</html>
<script>
    let combustivelRestante = 25
    let combustivelInicial = 25
    function mostrar() {
        let distancia = Number(ipt_km.value)
        let velo = Number(ipt_velo.value)

        let tempo = distancia / velo
        let combuGasto = distancia / 10

        combustivelRestante = combustivelRestante - combuGasto

        let porcentagemGasto = combuGasto * 100 / combustivelInicial

        let porcentagemRestante = combustivelRestante * 100 / combustivelInicial

        if(combustivelRestante >= 7.5) {
            id_exibir.innerHTML = `Ao percorrer ${distancia} km, 
            em velocidade média de ${velo} km/h, a viagem 
            durou ${tempo} horas. Ao todo, foram gastos 
            ${combuGasto} litro(s) de combustível (${porcentagemGasto}%). 
            Restam ${combustivelRestante} litro(s) de combustível (${porcentagemRestante}%).<br>
            <b>Bora continuar a viagem!`
        } else {
            id_exibir.innerHTML = `Ao percorrer ${distancia} km, 
            em velocidade média de ${velo} km/h, a viagem 
            durou ${tempo} horas. Ao todo, foram gastos 
            ${combuGasto} litro(s) de combustível (${porcentagemGasto}%). 
            Restam ${combustivelRestante} litro(s) de combustível (${porcentagemRestante}%).<br>
            <b>É melhor você abastecer!<b>`
        }
    }
</script>
